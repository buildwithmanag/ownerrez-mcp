[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ownerrez-mcp"
version = "0.2.0"
description = "A Model Context Protocol (MCP) server for the OwnerRez vacation-rental API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "OwnerRez MCP contributors" }]
keywords = ["mcp", "ownerrez", "vacation-rental", "claude", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/buildwithmanag/ownerrez-mcp"
Issues = "https://github.com/buildwithmanag/ownerrez-mcp/issues"

[project.scripts]
ownerrez-mcp = "ownerrez_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ownerrez_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
